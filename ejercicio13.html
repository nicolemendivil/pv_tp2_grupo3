<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio13</title>
</head>
<body>
    <script>
        let cantidad=prompt(`ingrese cantidad de numeros que desea agregar al arreglo:`);
        let numero=[];
        for(let i=0;i<cantidad;i++){
            let num= Number(prompt(`ingresar numero:`));
            numero.push(num);
        }
        const mostrarArreglo=(arreglo)=>{arreglo.forEach(num => {document.write(`${num}<br>`)
            
        });}

        document.write(`mostrar:<br>`);
        mostrarArreglo(numero);

    </script>
</body>
</html>
